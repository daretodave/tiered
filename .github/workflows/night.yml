name: night

# The night shift: one /digest tick a day. Writes plan/DIGEST.md
# — the morning briefing, the content saga's progress report —
# from the day's pulse. The breadth e2e stays with e2e-full.yml
# (~23:25 UTC); the digest READS that run's conclusion instead of
# re-running it, so this job needs no Docker/Supabase stack and
# no Playwright. The digest commit is notes-only (plan/ prose;
# the /jot carve-out — see skills/digest.md hard rule 5), so no
# verify gate runs here either. Shares the march concurrency
# group so cloud writers never race.

on:
  schedule:
    - cron: '30 10 * * *'   # daily ~06:30 ET, after e2e-full + the overnight ticks
  workflow_dispatch:

concurrency:
  # Its own group, not march's: GitHub keeps one pending run per
  # group and cancels it when the next queues, so a digest waiting
  # behind a long tick was evicted by march's next cron (#763). The
  # digest is notes-only and its push rebases on a rejection.
  group: night
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write         # the quota pause issue (scripts/cloud/quota.mjs)
      actions: read         # gh run list — the pulse (march + e2e-full)
      id-token: write
    steps:
      - name: Checkout (full history for the pulse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT (not GITHUB_TOKEN) so git push commits as the human
          # user — same identity posture as march.yml.
          token: ${{ secrets.ACTIONS_PAT }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Deps are needed only for `pnpm deploy:check` (the deploy
      # pulse). No Playwright, no Supabase — the digest never runs
      # the gate (notes-only carve-out).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Git author identity is set via GIT_AUTHOR_* / GIT_COMMITTER_*
      # env vars on the action step below, NOT via `git config` —
      # same mechanism and rationale as march.yml (the action's
      # internal git config would override a workflow-step config).

      # The quota governor, shared with march.yml: the newest reading
      # any march or night run cached comes back first, and the gate
      # skips the model while a usage cap (the weekly window, or the
      # plain-text "out of extra usage · resets <time> (UTC)" lockout)
      # is ahead of its reset. Before this, a spent cap failed the
      # digest every night until the reset (2026-10-15..19).
      - name: Quota cache restore
        uses: actions/cache/restore@v4
        with:
          path: .nexus/quota.json
          key: nexus-quota-${{ github.run_id }}
          restore-keys: nexus-quota-

      - name: Quota gate
        id: quota_gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          QUOTA_MAX: ${{ vars.NEXUS_QUOTA_MAX || '0.90' }}
        # The digest is one tick a day and notes-only: only a hard
        # lockout skips it, never the soft cap (--max off).
        run: |
          grep -qx '.nexus/' .git/info/exclude 2>/dev/null || echo '.nexus/' >> .git/info/exclude
          node scripts/cloud/quota.mjs gate --event "$EVENT" --max off || echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Run /digest (night shift)
        id: run_digest
        if: steps.quota_gate.outputs.skip != 'true'
        # Same action pin as march.yml — drift-control on the wrapper.
        uses: anthropics/claude-code-action@86eb26bf0139bdd75acd15ea5f00f45ee0a284c2 # v1.0.122
        timeout-minutes: 20
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Synthesis is where a stronger model earns its keep; the
          # night model leads the day one.
          claude_args: |
            --model claude-sonnet-5
            --dangerously-skip-permissions
          prompt: |
            You are tiered.tv's night shift running in CI. Read agents.md
            first, then execute skills/digest.md end to end — it is the
            single source of truth for this tick.

            Cloud notes:

            1. The digest is a NOTES-ONLY commit (plan/DIGEST.md, plus any
               plan/AUDIT.md or plan/CANDIDATES.md rows). The /jot
               carve-out applies: no verify gate, no deploy gate. Do not
               run pnpm verify this tick, foreground or otherwise.
            2. The breadth verdict comes from the latest e2e-full run
               (gh run list --workflow e2e-full) — read it, never re-run
               it. A red run becomes a HIGH plan/AUDIT.md row.
            3. Tuning proposals become plan/CANDIDATES.md candidates,
               never direct edits. Only local /oversight promotes.
            4. Your one commit MUST end with this exact trailer (a blank
               line before it, then the trailer as its own line):

                  Cloud-Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            5. One commit (digest: <YYYY-MM-DD>), push (rejected: git pull
               --rebase, push again), exit. If the tick
               cannot ship cleanly, exit with a one-line note in this log
               — do not half-commit.
        env:
          # Deploy pulse (pnpm deploy:check reads the state at HEAD)
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          # ACTIONS_PAT so gh calls and the push identify as the human.
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
          # Author identity — same env-var path as march.yml.
          GIT_AUTHOR_NAME:     'David Rehmat'
          GIT_AUTHOR_EMAIL:    'me@dave.blue'
          GIT_COMMITTER_NAME:  'David Rehmat'
          GIT_COMMITTER_EMAIL: 'me@dave.blue'

      - name: Quota read
        id: quota
        if: always() && (steps.run_digest.outcome == 'success' || steps.run_digest.outcome == 'failure')
        env:
          EXEC_FILE: ${{ steps.run_digest.outputs.execution_file }}
        run: node scripts/cloud/quota.mjs read "$EXEC_FILE"

      - name: Quota cache save
        if: always() && steps.quota.outputs.quota != ''
        uses: actions/cache/save@v4
        with:
          path: .nexus/quota.json
          key: nexus-quota-${{ github.run_id }}-${{ github.run_attempt }}

      # A cap lockout is not a crash: one pause issue, no crash issue.
      - name: Pause on the quota
        if: always() && steps.quota.outputs.status == 'rejected'
        env:
          GH_TOKEN: ${{ github.token }}
          RESETS: ${{ steps.quota.outputs.resets }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/cloud/quota.mjs pause --resets "$RESETS" --run-url "$RUN_URL"

      - name: Open night-failed issue if action crashed
        if: failure() && steps.quota.outputs.status != 'rejected'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT }}
        run: |
          # Staleness bound (candidate #32) — same pattern as e2e-full/march.
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%d)
          existing=$(gh issue list --search "in:title \"Night digest crashed\" state:open updated:>=$cutoff" --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create \
              --title "Night digest crashed: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --body "The night shift exited non-zero. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "Recently-updated open issue #$existing matches — appending this run's link instead of filing a duplicate."
            gh issue comment "$existing" --body "Recurred $(date -u +%Y-%m-%dT%H:%M:%SZ). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
